; ISOLATED supervisor for the streaming demo. Separate sock/pidfile from production.
; autostart=false -> nothing launches until you explicitly start it AND the GPU is free.
[supervisord]
logfile=/home/ailab/ASR/Qwen3ASR-streaming/logs/supervisord.log
pidfile=/home/ailab/ASR/Qwen3ASR-streaming/supervisord.pid
nodaemon=false

[program:qwen3asr-streaming]
command=/home/ailab/ASR/Qwen3ASR-streaming/run_streaming.sh
directory=/home/ailab/ASR/Qwen3ASR-streaming
autostart=false
autorestart=false
startsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/home/ailab/ASR/Qwen3ASR-streaming/logs/streaming.log
stderr_logfile=/home/ailab/ASR/Qwen3ASR-streaming/logs/streaming_err.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3

[unix_http_server]
file=/home/ailab/ASR/Qwen3ASR-streaming/supervisor.sock

[supervisorctl]
serverurl=unix:///home/ailab/ASR/Qwen3ASR-streaming/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
